# Netlify deploy — Boro halal dashboard (pure static, no build step).
#
# The dashboard is a single static file (demo-boro.html) that reads pre-generated
# window.* feeds (dashboard_data.js, halal_data.js, info_data.js). There is NO
# server at view-time. Data freshness comes from GitHub Actions: the nightly-scan
# job regenerates + commits dashboard_data.js, and that push triggers a Netlify
# redeploy — so the deployed dashboard tracks live paper-trading state hands-free.
#
# Deploy:
#   1. Connect this repo (branch V-1.0) to Netlify.
#   2. Build command: leave empty.  Publish directory: "."  (set below).
#   3. Done — pushes to V-1.0 redeploy automatically.
#
# NOTE: publish="." serves the whole repo over the CDN. No secrets are exposed
# (.env is git-ignored and never deployed); only committed files ship. If you'd
# rather not expose source, move the static assets into a dedicated folder and
# point `publish` there.

[build]
  publish = "."
  command = ""

# Serve the dashboard at the site root.
[[redirects]]
  from = "/"
  to = "/demo-boro.html"
  status = 200

# Don't cache the live data feed (so refreshes show immediately); cache the rest.
[[headers]]
  for = "/dashboard_data.js"
  [headers.values]
    Cache-Control = "no-cache, max-age=0"
