# Netlify deploy — Boro halal dashboard (pure static, no build step).
#
# The dashboard is a single static file (site/demo-boro.html) that reads pre-generated
# window.* feeds in site/ (dashboard_data.js, halal_data.js, info_data.js,
# backtest_data.js). There is NO server at view-time. Data freshness comes from
# GitHub Actions: the nightly-scan job regenerates + commits site/dashboard_data.js,
# and that push triggers a Netlify redeploy.
#
# Deploy:
#   1. Connect this repo (branch dev) to Netlify.
#   2. Build command: leave empty.  Publish directory: "site"  (set below).
#
# Only site/ is published, so source, docs and agent notes in the repo root are
# never served. Keep anything that must not be public out of site/.

[build]
  publish = "site"
  command = ""
  functions = "netlify/functions"   # serverless trigger (dispatch.js) for the buttons

# Serve the dashboard at the site root.
[[redirects]]
  from = "/"
  to = "/demo-boro.html"
  status = 200

# Don't cache the live data feed (so refreshes show immediately); cache the rest.
[[headers]]
  for = "/dashboard_data.js"
  [headers.values]
    Cache-Control = "no-cache, max-age=0"
