name: Trading Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      job:
        description: "Job to run manually"
        required: true
        default: "nightly-scan"
        type: choice
        options:
          - nightly-scan
          - auto-close
          - weekly-backtest
          - quarterly-rescreen
          - research-backtest
      ticker:
        description: "Ticker for research-backtest (ignored by other jobs)"
        required: false
        default: "RELIANCE"
      years:
        description: "Years of history for research-backtest (ignored by other jobs)"
        required: false
        default: "5"

env:
  TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
  PYTHONPATH: ${{ github.workspace }}

jobs:
  # ── CI Tests (on every push to main) ──────────────────────────────────────
  ci-tests:
    name: CI Tests
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate imports
        run: |
          python -c "
          from src import ensemble, risk_manager, scanner
          from src import feature_engineering, data_provider
          from src import news_sentiment, macro_indicators, explainer
          from src import mlflow_tracker, drift_detector
          from src import walk_forward
          from src import control_server
          print('All imports OK')
          "

      - name: Run tests
        run: |
          if [ -d tests ] && [ "$(ls -A tests)" ]; then
            pip install pytest
            pytest tests/ -v --tb=short
          else
            echo "No tests found, skipping pytest"
          fi

      - name: Notify CI failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="HTML" \
            -d text="❌ <b>CI FAILED</b>%0ARepo: ${{ github.repository }}%0ACommit: ${{ github.sha }}%0A<a href='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'>View logs</a>"

  # ── Nightly Scan (9:00 AM IST, Mon–Fri) ───────────────────────────────────
  nightly-scan:
    name: Nightly Scan
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'nightly-scan'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore paper portfolio state
        uses: actions/cache@v4
        with:
          path: results/
          key: portfolio-state-${{ github.run_id }}
          restore-keys: portfolio-state-

      - name: Run daily briefing
        run: python -m src.daily_briefing --capital 50000

      - name: Run drift check
        run: python -m src.drift_detector --ticker RELIANCE || true

      - name: Refresh dashboard feed
        run: python -m scripts.export_dashboard --capital 50000 || true

      - name: Save portfolio state
        uses: actions/cache/save@v4
        with:
          path: results/
          key: portfolio-state-${{ github.run_id }}

      - name: Notify on failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="HTML" \
            -d text="❌ <b>NIGHTLY SCAN FAILED</b>%0ACheck: <a href='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'>GitHub Actions</a>"

  # ── Auto-Close Check (3:45 PM IST, Mon–Fri) ───────────────────────────────
  auto-close:
    name: Auto-Close Positions
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'auto-close'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore paper portfolio state
        uses: actions/cache@v4
        with:
          path: results/
          key: portfolio-state-
          restore-keys: portfolio-state-

      - name: Run auto-close
        run: python -m src.auto_close

      - name: Save portfolio state
        uses: actions/cache/save@v4
        with:
          path: results/
          key: portfolio-state-${{ github.run_id }}

      - name: Notify on failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="HTML" \
            -d text="❌ <b>AUTO-CLOSE FAILED</b>%0ACheck: <a href='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'>GitHub Actions</a>"

  # ── Weekly Backtest (Sunday 10:00 AM IST) ─────────────────────────────────
  weekly-backtest:
    name: Weekly Backtest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'weekly-backtest'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backtest — RELIANCE
        run: python -m src.pipeline --ticker RELIANCE --years 5

      - name: Run backtest — TCS
        run: python -m src.pipeline --ticker TCS --years 5

      - name: Upload backtest results
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results-${{ github.run_id }}
          path: results/
          retention-days: 30

      - name: Notify on failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="HTML" \
            -d text="❌ <b>WEEKLY BACKTEST FAILED</b>%0ACheck: <a href='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'>GitHub Actions</a>"

  # ── Research Backtest (on-demand, from the dashboard) ─────────────────────
  research-backtest:
    name: Research Backtest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'research-backtest'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BT_TICKER: ${{ github.event.inputs.ticker }}
      BT_YEARS: ${{ github.event.inputs.years }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backtest and export to dashboard history
        run: python -m scripts.export_backtest --ticker "$BT_TICKER" --years "$BT_YEARS"

      - name: Notify on failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="HTML" \
            -d text="❌ <b>RESEARCH BACKTEST FAILED</b> (${BT_TICKER})%0ACheck: <a href='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'>GitHub Actions</a>"

  # ── Quarterly Halal Re-screen (1st of Jan/Apr/Jul/Oct) ─────────────────────
  quarterly-rescreen:
    name: Quarterly Halal Re-screen
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'quarterly-rescreen'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install fundamentals source (best-effort)
        run: pip install Bharat-sm-data || echo "Bharat-sm-data unavailable — refresh will keep existing cache"

      - name: Refresh fundamentals (preserves cache on failure)
        run: python scripts/refresh_fundamentals.py || echo "refresh failed — keeping existing cache, tier diff still runs"

      - name: Rebuild halal dashboard feed
        run: python scripts/build_halal_dashboard_data.py || true

      - name: Diff tiers + push changes to Telegram
        run: python -m src.tier_monitor --notify

      - name: Notify on failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="HTML" \
            -d text="❌ <b>QUARTERLY RE-SCREEN FAILED</b>%0ACheck: <a href='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'>GitHub Actions</a>"
