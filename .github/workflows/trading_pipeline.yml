name: Trading Pipeline

on:
  schedule:
    # 9:00 AM IST = 3:30 AM UTC, Mon–Fri
    - cron: "30 3 * * 1-5"
    # 3:45 PM IST = 10:15 AM UTC, Mon–Fri
    - cron: "15 10 * * 1-5"
    # Sunday 10:00 AM IST = 4:30 AM UTC
    - cron: "30 4 * * 0"
    # Quarterly halal re-screen — 1st of Jan/Apr/Jul/Oct, 9:30 AM IST = 4:00 AM UTC
    - cron: "0 4 1 1,4,7,10 *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      job:
        description: "Job to run manually"
        required: true
        default: "nightly-scan"
        type: choice
        options:
          - nightly-scan
          - auto-close
          - weekly-backtest
          - quarterly-rescreen
          - research-backtest
      ticker:
        description: "Ticker for research-backtest (ignored by other jobs)"
        required: false
        default: "RELIANCE"
      years:
        description: "Years of history for research-backtest (ignored by other jobs)"
        required: false
        default: "5"

env:
  TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
  PYTHONPATH: ${{ github.workspace }}
  BORO_RELIABILITY_MODE: ${{ vars.BORO_RELIABILITY_MODE || 'legacy' }}
  BORO_RELIABILITY_DB: results/reliability.db

jobs:
  # ── CI Tests (on every push to main) ──────────────────────────────────────
  ci-tests:
    name: CI Tests
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate imports
        run: |
          python -c "
          from src import ensemble, risk_manager, scanner
          from src import feature_engineering, data_provider
          from src import news_sentiment, macro_indicators, explainer
          from src import mlflow_tracker, drift_detector
          from src import walk_forward
          from src import control_server
          from src import strategy_presets
          from src.reliability import store, statistics, walk_forward
          from src.reliability import ledger, outbox, controls, governance, shadow, importers
          from src.reliability import nse_normalizers, nse_bundle, nse_pipeline, activation
          from src.engine import AlphaModel, PortfolioModel, RiskModel, ExecutionModel, TradingEngine
          print('All imports OK')
          "

      - name: Run reliability contract tests
        run: >-
          pytest
          tests/test_reliability_store.py
          tests/test_reliability_importers.py
          tests/test_reliability_statistics.py
          tests/test_signal_ledger.py
          tests/test_delivery_outbox.py
          tests/test_reliability_controls.py
          tests/test_reliability_governance.py
          tests/test_reliability_integration.py
          tests/test_nse_normalizers.py
          tests/test_nse_bundle_builder.py
          tests/test_nse_pipeline.py
          tests/test_shadow_activation.py
          tests/test_daily_shadow_dispatch.py
          -v --tb=short

      - name: Run tests
        run: |
          if [ -d tests ] && [ "$(ls -A tests)" ]; then
            pip install pytest
            pytest tests/ -v --tb=short
          else
            echo "No tests found, skipping pytest"
          fi

      - name: Notify CI failure
        if: failure()
        env:
          NOTICE_SIGNAL_ID: "github:ci-failure:${{ github.run_id }}"
          NOTICE_TEXT: "Boro service update delayed. No recommendation was sent; please check the dashboard."
        run: |
          python scripts/queue_telegram_notice.py \
            --signal-id "$NOTICE_SIGNAL_ID" --text "$NOTICE_TEXT" || true

  # ── Nightly Scan (9:00 AM IST, Mon–Fri) ───────────────────────────────────
  nightly-scan:
    name: Nightly Scan
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'nightly-scan' ||
      github.event_name == 'schedule' && startsWith(github.event.schedule, '30 3')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore paper portfolio state
        uses: actions/cache@v4
        with:
          path: results/
          key: portfolio-state-${{ github.run_id }}
          restore-keys: portfolio-state-

      - name: Run daily briefing
        run: python -m src.daily_briefing --capital 50000

      - name: Run drift check
        run: python -m src.drift_detector --ticker RELIANCE || true

      - name: Refresh dashboard feed
        run: python -m scripts.export_dashboard --capital 50000 || true

      - name: Commit dashboard feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard_data.js
          if git diff --cached --quiet; then
            echo "No dashboard changes to commit."
          else
            git commit -m "chore(dashboard): nightly live feed refresh"
            git push
          fi

      - name: Save portfolio state
        uses: actions/cache/save@v4
        with:
          path: results/
          key: portfolio-state-${{ github.run_id }}

      - name: Notify on failure
        if: failure()
        env:
          NOTICE_SIGNAL_ID: "github:nightly-scan-failure:${{ github.run_id }}"
          NOTICE_TEXT: "Boro's scheduled market update was delayed. Please check the dashboard before acting."
        run: |
          python scripts/queue_telegram_notice.py \
            --signal-id "$NOTICE_SIGNAL_ID" --text "$NOTICE_TEXT" || true

  # ── Auto-Close Check (3:45 PM IST, Mon–Fri) ───────────────────────────────
  auto-close:
    name: Auto-Close Positions
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'auto-close' ||
      github.event_name == 'schedule' && startsWith(github.event.schedule, '15 10')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore paper portfolio state
        uses: actions/cache@v4
        with:
          path: results/
          key: portfolio-state-
          restore-keys: portfolio-state-

      - name: Run auto-close
        run: python -m src.auto_close

      - name: Save portfolio state
        uses: actions/cache/save@v4
        with:
          path: results/
          key: portfolio-state-${{ github.run_id }}

      - name: Notify on failure
        if: failure()
        env:
          NOTICE_SIGNAL_ID: "github:auto-close-failure:${{ github.run_id }}"
          NOTICE_TEXT: "Boro's scheduled paper close update was delayed. Please check the dashboard."
        run: |
          python scripts/queue_telegram_notice.py \
            --signal-id "$NOTICE_SIGNAL_ID" --text "$NOTICE_TEXT" || true

  # ── Weekly OOS Validation (Sunday 10:00 AM IST) ───────────────────────────
  weekly-backtest:
    name: Weekly OOS Validation
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'weekly-backtest' ||
      github.event_name == 'schedule' && startsWith(github.event.schedule, '30 4')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create validation output directory
        run: mkdir -p results/weekly-validation

      - name: Portfolio walk-forward versus Nifty
        run: |
          set -o pipefail
          python -m src.walk_forward --portfolio --years 5 --splits 4 \
            | tee results/weekly-validation/portfolio.txt

      - name: Compare daily-bar V2 challenger
        run: |
          set -o pipefail
          python -m src.walk_forward --compare-v2 --ticker RELIANCE --years 5 --splits 4 \
            | tee results/weekly-validation/v2-reliance.txt
          python -m src.walk_forward --compare-v2 --ticker TCS --years 5 --splits 4 \
            | tee results/weekly-validation/v2-tcs.txt

      - name: Test regime and relative-strength selection
        run: |
          set -o pipefail
          python -m src.walk_forward --selection --years 3 --splits 4 \
            | tee results/weekly-validation/selection.txt

      - name: Upload validation reports
        uses: actions/upload-artifact@v4
        with:
          name: weekly-oos-validation-${{ github.run_id }}
          path: results/weekly-validation/
          retention-days: 90

      - name: Notify on failure
        if: failure()
        env:
          NOTICE_SIGNAL_ID: "github:weekly-validation-failure:${{ github.run_id }}"
          NOTICE_TEXT: "Boro's weekly research validation was delayed. Recommendations remain gated."
        run: |
          python scripts/queue_telegram_notice.py \
            --signal-id "$NOTICE_SIGNAL_ID" --text "$NOTICE_TEXT" || true

  # ── Research Backtest (on-demand, from the dashboard) ─────────────────────
  research-backtest:
    name: Research Backtest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'research-backtest'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      BT_TICKER: ${{ github.event.inputs.ticker }}
      BT_YEARS: ${{ github.event.inputs.years }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backtest and export to dashboard history
        run: python -m scripts.export_backtest --ticker "$BT_TICKER" --years "$BT_YEARS"

      - name: Commit backtest history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/backtest_history.json backtest_data.js
          if git diff --cached --quiet; then
            echo "No backtest changes to commit."
          else
            git commit -m "chore(backtest): research run — ${BT_TICKER}"
            git push
          fi

      - name: Notify on failure
        if: failure()
        env:
          NOTICE_SIGNAL_ID: "github:research-backtest-failure:${{ github.run_id }}"
          NOTICE_TEXT: "Boro's requested research backtest was delayed. Please check the dashboard."
        run: |
          python scripts/queue_telegram_notice.py \
            --signal-id "$NOTICE_SIGNAL_ID" --text "$NOTICE_TEXT" || true

  # ── Quarterly Halal Re-screen (1st of Jan/Apr/Jul/Oct) ─────────────────────
  # Kills the "who screens the screener" SPOF: refresh fundamentals → rebuild the
  # halal dashboard feed → diff tiers → push transitions to Telegram → commit the
  # refreshed cache/snapshot back so the next quarter diffs against it.
  quarterly-rescreen:
    name: Quarterly Halal Re-screen
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'quarterly-rescreen' ||
      github.event_name == 'schedule' && startsWith(github.event.schedule, '0 4 1')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install fundamentals source (best-effort)
        run: pip install Bharat-sm-data || echo "Bharat-sm-data unavailable — refresh will keep existing cache"

      - name: Refresh fundamentals (preserves cache on failure)
        run: python scripts/refresh_fundamentals.py || echo "refresh failed — keeping existing cache, tier diff still runs"

      - name: Rebuild halal dashboard feed
        run: python scripts/build_halal_dashboard_data.py || true

      - name: Diff tiers + push changes to Telegram
        run: python -m src.tier_monitor --notify

      - name: Commit refreshed screening state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fundamentals_cache.json data/tier_snapshot.json halal_data.js
          if git diff --cached --quiet; then
            echo "No screening changes to commit."
          else
            git commit -m "chore(halal): quarterly re-screen — refresh fundamentals + tier snapshot"
            git push
          fi

      - name: Notify on failure
        if: failure()
        env:
          NOTICE_SIGNAL_ID: "github:quarterly-rescreen-failure:${{ github.run_id }}"
          NOTICE_TEXT: "Boro's scheduled halal re-screen was delayed. Existing recommendation gates remain active."
        run: |
          python scripts/queue_telegram_notice.py \
            --signal-id "$NOTICE_SIGNAL_ID" --text "$NOTICE_TEXT" || true
