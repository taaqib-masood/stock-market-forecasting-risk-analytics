name: Trading Pipeline

on:
  schedule:
    # 9:00 AM IST = 3:30 AM UTC, Mon–Fri
    - cron: "30 3 * * 1-5"
    # 3:45 PM IST = 10:15 AM UTC, Mon–Fri
    - cron: "15 10 * * 1-5"
    # Sunday 10:00 AM IST = 4:30 AM UTC
    - cron: "30 4 * * 0"
    # Quarterly halal re-screen — 1st of Jan/Apr/Jul/Oct, 9:30 AM IST = 4:00 AM UTC
    - cron: "0 4 1 1,4,7,10 *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      job:
        description: "Job to run manually"
        required: true
        default: "nightly-scan"
        type: choice
        options:
          - nightly-scan
          - auto-close
          - weekly-backtest
          - quarterly-rescreen

env:
  TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
  PYTHONPATH: ${{ github.workspace }}

jobs:
  # ── CI Tests (on every push to main) ──────────────────────────────────────
  ci-tests:
    name: CI Tests
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate imports
        run: |
          python -c "
          from src import ensemble, risk_manager, scanner
          from src import feature_engineering, data_provider
          from src import news_sentiment, macro_indicators, explainer
          from src import mlflow_tracker, drift_detector
          from src import walk_forward
          from src import control_server
          print('All imports OK')
          "

      - name: Run tests
        run: |
          if [ -d tests ] && [ "$(ls -A tests)" ]; then
            pip install pytest
            pytest tests/ -v --tb=short
          else
            echo "No tests found, skipping pytest"
          fi

      - name: Notify CI failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="HTML" \
            -d text="❌ <b>CI FAILED</b>%0ARepo: ${{ github.repository }}%0ACommit: ${{ github.sha }}%0A<a href='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'>View logs</a>"

  # ── Nightly Scan (9:00 AM IST, Mon–Fri) ───────────────────────────────────
  nightly-scan:
    name: Nightly Scan
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'nightly-scan' ||
      github.event_name == 'schedule' && startsWith(github.event.schedule, '30 3')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore paper portfolio state
        uses: actions/cache@v4
        with:
          path: results/
          key: portfolio-state-${{ github.run_id }}
          restore-keys: portfolio-state-

      - name: Run daily briefing
        run: python -m src.daily_briefing --capital 50000

      - name: Run drift check
        run: python -m src.drift_detector --ticker RELIANCE || true

      - name: Refresh dashboard feed
        run: python -m scripts.export_dashboard --capital 50000 || true

      - name: Commit dashboard feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard_data.js
          if git diff --cached --quiet; then
            echo "No dashboard changes to commit."
          else
            git commit -m "chore(dashboard): nightly live feed refresh [skip ci]"
            git push
          fi

      - name: Save portfolio state
        uses: actions/cache/save@v4
        with:
          path: results/
          key: portfolio-state-${{ github.run_id }}

      - name: Notify on failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="HTML" \
            -d text="❌ <b>NIGHTLY SCAN FAILED</b>%0ACheck: <a href='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'>GitHub Actions</a>"

  # ── Auto-Close Check (3:45 PM IST, Mon–Fri) ───────────────────────────────
  auto-close:
    name: Auto-Close Positions
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'auto-close' ||
      github.event_name == 'schedule' && startsWith(github.event.schedule, '15 10')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore paper portfolio state
        uses: actions/cache@v4
        with:
          path: results/
          key: portfolio-state-
          restore-keys: portfolio-state-

      - name: Run auto-close
        run: python -m src.auto_close

      - name: Save portfolio state
        uses: actions/cache/save@v4
        with:
          path: results/
          key: portfolio-state-${{ github.run_id }}

      - name: Notify on failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="HTML" \
            -d text="❌ <b>AUTO-CLOSE FAILED</b>%0ACheck: <a href='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'>GitHub Actions</a>"

  # ── Weekly Backtest (Sunday 10:00 AM IST) ─────────────────────────────────
  weekly-backtest:
    name: Weekly Backtest
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'weekly-backtest' ||
      github.event_name == 'schedule' && startsWith(github.event.schedule, '30 4')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backtest — RELIANCE
        run: python -m src.pipeline --ticker RELIANCE --years 5

      - name: Run backtest — TCS
        run: python -m src.pipeline --ticker TCS --years 5

      - name: Upload backtest results
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results-${{ github.run_id }}
          path: results/
          retention-days: 30

      - name: Notify on failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="HTML" \
            -d text="❌ <b>WEEKLY BACKTEST FAILED</b>%0ACheck: <a href='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'>GitHub Actions</a>"

  # ── Quarterly Halal Re-screen (1st of Jan/Apr/Jul/Oct) ─────────────────────
  # Kills the "who screens the screener" SPOF: refresh fundamentals → rebuild the
  # halal dashboard feed → diff tiers → push transitions to Telegram → commit the
  # refreshed cache/snapshot back so the next quarter diffs against it.
  quarterly-rescreen:
    name: Quarterly Halal Re-screen
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'quarterly-rescreen' ||
      github.event_name == 'schedule' && startsWith(github.event.schedule, '0 4 1')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install fundamentals source (best-effort)
        run: pip install Bharat-sm-data || echo "Bharat-sm-data unavailable — refresh will keep existing cache"

      - name: Refresh fundamentals (preserves cache on failure)
        run: python scripts/refresh_fundamentals.py || echo "refresh failed — keeping existing cache, tier diff still runs"

      - name: Rebuild halal dashboard feed
        run: python scripts/build_halal_dashboard_data.py || true

      - name: Diff tiers + push changes to Telegram
        run: python -m src.tier_monitor --notify

      - name: Commit refreshed screening state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fundamentals_cache.json data/tier_snapshot.json halal_data.js
          if git diff --cached --quiet; then
            echo "No screening changes to commit."
          else
            git commit -m "chore(halal): quarterly re-screen — refresh fundamentals + tier snapshot [skip ci]"
            git push
          fi

      - name: Notify on failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="HTML" \
            -d text="❌ <b>QUARTERLY RE-SCREEN FAILED</b>%0ACheck: <a href='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'>GitHub Actions</a>"
