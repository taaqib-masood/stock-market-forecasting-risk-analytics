        .neo-inset { box-shadow: inset 4px 4px 8px rgba(0,0,0,0.06), inset -4px -4px 8px rgba(255,255,255,0.5); }

<body class="bg-surface font-body text-on-surface">
    <div id="root"></div>

    <script type="text/babel">

        // --- Common Components ---

                            </div>
                            <div>

                                <p className="text-[10px] uppercase tracking-wider text-on-surface-variant font-bold">Premium Analytics</p>
                            </div>
                        </div>
                    </div>
                    <nav className="flex-1 space-y-2">

                        <SidebarItem icon="query_stats" label="Screening" to="/bot-preview" active={location.pathname === '/bot-preview'} />
                        <SidebarItem icon="pie_chart" label="Portfolio" to="/" active={location.pathname === '/'} />
                        <SidebarItem icon="security" label="Protection" to="/broker-connect" active={location.pathname === '/broker-connect'} />
                        <SidebarItem icon="receipt_long" label="Obligations" to="/trade-confirm" active={location.pathname === '/trade-confirm'} />

                        <SidebarItem icon="history" label="Backtesting" to="/backtesting" active={location.pathname === '/backtesting'} />

                        <SidebarItem icon="api" label="API" to="/api-playground" active={location.pathname === '/api-playground'} />

                </aside>

        const Header = ({ title = "Boro Portfolio" }) => {

                        <div className="relative">
                            <input className="bg-surface neomorphic-inset border-none rounded-full px-6 py-2 text-sm focus:ring-2 focus:ring-primary/20 w-64 placeholder:text-on-surface-variant/50" placeholder="Search insights..." type="text" />

                        <button className="neomorphic-raised p-2 rounded-full text-on-surface-variant hover:text-primary transition-colors">

                </header>
            );
        };

        // --- Screens ---

        const SyncScreen = () => {
            const [percent, setPercent] = useState(68);

            useEffect(() => {
                const interval = setInterval(() => {
                    setPercent(p => p < 99 ? p + (Math.random() * 0.5) : p);
                }, 3000);
                return () => clearInterval(interval);
            }, []);

            const offset = 750 - (percent / 100 * 750);

            return (
                <div className="flex-1 flex flex-col items-center justify-center p-12 relative z-10">
                    <div className="relative w-[500px] h-[500px] flex items-center justify-center">
                        <div className="absolute inset-0 rounded-full neomorphic-inset"></div>
                        <div className="absolute inset-12 rounded-full neomorphic-raised opacity-50"></div>
                        <div className="relative z-10 w-64 h-64 rounded-full neomorphic-raised flex items-center justify-center bg-surface">

                                <div className="w-full h-0.5 bg-primary/20 mt-1 overflow-hidden rounded-full">

                                </div>
                            </div>

                        <div className="absolute bottom-20 left-4 flex flex-col items-start gap-2">

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8 mb-16">

                                    <div className="absolute inset-0 bg-gradient-to-br from-indigo-900 via-slate-900 to-black opacity-80"></div>
                                    <div className="h-8 w-full flex justify-between items-center px-8 pt-2 relative z-10">
                                        <span className="text-[10px] text-white font-bold">9:41</span>
                                    </div>
                                    <div className="flex flex-col items-center pt-12 relative z-10">
                                        <span className="text-5xl font-extralight text-white mb-2">9:41</span>

                </div>
            );

        const EngineDashboardScreen = () => {
             return (
                <div className="p-12 lg:p-16 z-10 relative">
                     <header className="flex items-center justify-between mb-16">
                        <div>
                            <h2 className="text-4xl font-headline font-extrabold tracking-tight text-on-surface">Engine Dashboard</h2>
                            <p className="text-on-surface-variant font-medium mt-2 text-sm">Silk Phase 4 Management Console</p>

                            <div className="space-y-5 font-mono text-xs">
                                <div className="flex items-center justify-between"><span className="text-on-surface-variant/70">Last Run</span><span className="text-green-600 font-bold">SUCCESS</span></div>

                     <div className="w-2/3 flex flex-col gap-6 h-full overflow-hidden">
                         <div className="neomorph-raised p-8 rounded-3xl flex flex-col gap-6">
                            <h2 className="text-xl font-semibold text-on-surface">Interactive Playground</h2>
                            <div className="neomorph-inset p-4 rounded-2xl h-48">
                                <textarea className="w-full h-full bg-transparent border-none focus:ring-0 text-on-surface font-mono text-sm resize-none" defaultValue='{"rebalance_strategy": "drift_controlled"}'></textarea>

             )

        const App = () => {
            return (
                <MemoryRouter>

                            <div className="flex-1 overflow-y-auto custom-scrollbar relative">

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
